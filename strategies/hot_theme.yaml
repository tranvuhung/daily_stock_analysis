# Hot Theme Strategy

name: hot_theme
display_name: 热点题材
display_name_en: "Hot Theme"
description: Tracks policy, industry, and market hot themes to assess theme strength, sector spillover, and the stock's relative strength.
category: framework
core_rules: [2, 3, 5, 7]
required_tools:
  - get_sector_rankings
  - search_stock_news
  - get_realtime_quote
  - analyze_trend
aliases: [热点, 题材, 热点题材]
default_priority: 35
market_regimes: [sector_hot]

instructions: |
  **Hot Theme Strategy**

  When to use:
  - The market shows a clear hot theme driven by policy, industry, a technology roadmap, or concentrated fund flows (crowded positioning).
  - You need to judge whether the stock genuinely benefits from the theme rather than merely riding the concept.

  Analysis framework:

  1. **Theme strength**
     - Use `get_sector_rankings` to check whether the related sector ranks near the top in recent gains, turnover value, or popularity.
     - Observe whether the theme is spreading from a few core leaders to many stocks within the sector.
     - If only a single stock is moving and the sector is not resonating, reduce the signal weight.

  2. **Stock relevance**
     - Use `search_stock_news` to check whether the company's business, orders, capacity, customers, or announcements are directly related to the theme.
     - Distinguish between "substantive beneficiary", "indirect beneficiary", and "weak concept linkage".
     - When the concept linkage is weak but the price has already risen sharply, flag the risk of the theme being priced out (profit-taking on the theme).

  3. **Relative strength**
     - Use `get_realtime_quote` and `analyze_trend` to judge whether the stock's gain, volume ratio, and turnover rate are stronger than the sector average.
     - Strong hot-theme stocks typically show heavy volume, active turnover, and pullbacks that hold key moving averages.

  4. **Timing and risk**
     - Do not chase during consecutive accelerating moves or at high-bias positions.
     - If news coverage concentrates on "already surged", "funds piling in", or "speculative hot-money battles on the Dragon-Tiger list", watch for a short-term sentiment top.
     - Major negative news, regulatory inquiries, or clarification announcements can single-handedly downgrade the rating.

  Output requirements:
  - State the current theme stage clearly: Launch / Spillover / Divergence / Fading.
  - Explain the substantive relevance between the stock and the theme.
  - Provide actionable trigger conditions: support holding on a pullback, heavy-volume breakout, continued sector resonance, or stop-loss when the theme fades.

  Suggested score adjustments:
  - Theme is in the launch or spillover stage and the stock is a substantive beneficiary: `sentiment_score +12`
  - Stock is stronger than its sector with volume confirmation: additional `+6`
  - Theme enters the divergence or fading stage: `sentiment_score -8`
  - Merely riding the concept with excessive bias: `sentiment_score -12`
