# Volume Breakout Strategy
# Price breaks above resistance on heavy volume (>2x average).

name: volume_breakout
display_name: "Bứt phá kèm khối lượng"
display_name_en: "Volume Breakout"
description: Detects heavy-volume breakouts above resistance. Applicable when the stock price is approaching a known resistance level.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: ["bứt phá kèm khối lượng", "bứt phá", "breakout"]
default_priority: 30
market_regimes: [trending_up]

instructions: |
  **Volume Breakout Strategy**

  Breakout criteria:

  1. **Resistance identification**:
     - Use `analyze_trend` → resistance_levels to obtain resistance levels.
     - Typically the 20-day high or the top of a prior consolidation range.

  2. **Volume confirmation** (related principle 3: efficiency first):
     - Today's volume > 2x the 5-day average volume.
     - Confirm with `get_realtime_quote` → volume_ratio > 2.0.
     - Cross-check by computing average volume with `get_daily_history`.

  3. **Price confirmation** (related principle 1: strict entry):
     - The close must hold above the resistance level.
     - The close should be in the upper 30% of the day's range (strong close).
     - Post-breakout bias check: must still be < 5% to avoid chasing highs.

  4. **Follow-through validation** (if data is available):
     - The next day's open should be above the breakout level, distinguishing a true breakout from a false one.

  5. **Risk filter** (related principle 5: risk screening):
     - Use `search_stock_news` to confirm there is no major negative news.
     - PE should not be excessive (avoid bubble-type breakouts).

  Score adjustments:
  - Confirmed heavy-volume breakout: sentiment_score +12
  - Breakout with sector resonance (the sector is also strengthening): additional +5
  - Set the ideal buy point near the breakout level and the stop-loss 3% below the breakout level.
  - Note "volume breakout" in `buy_reason` and `volume_analysis`.
