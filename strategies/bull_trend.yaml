# Default Bull Trend Strategy

name: bull_trend
display_name: "Xu hướng tăng (mặc định)"
display_name_en: "Default Bull Trend"
description: Default priority strategy for single-stock analysis; identifies bullish MA alignment, trend continuation, and buy-the-dip opportunities on pullbacks.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: ["xu hướng tăng", "xu hướng", "phân tích xu hướng", "bull trend"]
default_active: true
default_router: true
default_priority: 10
market_regimes: [trending_up]

instructions: |
  **Default Bull Trend Strategy**

  When to use:
  - The default strategy for routine single-stock analysis.
  - Prioritize opportunities that combine "uptrend + controllable risk + no chasing highs".

  Analysis framework:

  1. **Trend confirmation (highest priority)**
     - Use `analyze_trend` to assess the MA5/MA10/MA20 alignment.
     - MA5 >= MA10 >= MA20 with an upward-sloping MA20 is treated as a bullish structure.
     - If price breaks significantly below MA20, reduce the bullish weighting.

  2. **Position and timing**
     - Prefer "pullback that holds support" over "chasing at highs".
     - When price is too far above MA5/MA10, advise waiting for a pullback.
     - A heavy-volume breakout above meaningful resistance can raise the win-probability rating.

  3. **Price-volume validation**
     - Use `get_daily_history` to check whether breakout days / rebound days came on expanding volume.
     - Be cautious with rallies on shrinking volume; watch for divergence when heavy volume fails to lift price (stalling).

  4. **Trade recommendation output**
     - Output a clear "Buy / Watch / Reduce" bias together with its trigger conditions.
     - Always provide a stop-loss reference (e.g., below MA20 or below the structural low).
     - If there is no clear edge, explicitly state "No trade for now" to avoid overtrading.

  Suggested score adjustments:
  - Bullish MA alignment + good trend strength: `sentiment_score +12`
  - Stabilizing after a pullback to a key moving average: `sentiment_score +8`
  - Heavy-volume breakout above key resistance: `sentiment_score +10`
  - Breaks below MA20 or trend weakens: `sentiment_score -12`
