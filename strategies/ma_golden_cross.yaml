# MA Golden Cross Strategy
# MA5 crosses above MA10 (or MA10 above MA20) with volume confirmation.

name: ma_golden_cross
display_name: 均线金叉
display_name_en: "MA Golden Cross"
description: Detects moving-average golden crosses confirmed by volume, a classic trend-reversal / trend-continuation signal.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [均线金叉, 金叉]
default_priority: 20
market_regimes: [trending_up]

instructions: |
  **MA Golden Cross Strategy**

  Signal criteria:

  1. **Golden cross detection** (related principle 2: trend trading):
     - Use `analyze_trend` to check the moving-average alignment and MACD status.
     - Primary signal: MA5 crossed above MA10 within the last 3 trading days.
     - Strong signal: MA10 crosses above MA20 (slower but more reliable).
     - Check whether MACD status is a golden cross or a golden cross above the zero line.

  2. **Volume confirmation** (related principle 3: efficiency first):
     - Volume on the golden-cross day should be above the 5-day average volume.
     - Verify with `get_daily_history`.
     - A volume ratio > 1.2 on the golden-cross day is a positive signal.

  3. **Trend context**:
     - Golden cross after consolidation: strongest signal.
     - Golden cross within an uptrend: continuation signal.
     - Golden cross during a deep decline: weak signal, needs more confirmation.

  4. **Price position** (related principle 1: strict entry):
     - Price should be near or above the crossing moving averages.
     - Bias (deviation from MA) < 5% — avoid chasing highs with a late entry.

  Score adjustments:
  - MA5 × MA10 golden cross with volume confirmation: sentiment_score +10
  - MA10 × MA20 golden cross: sentiment_score +8
  - MACD golden cross above the zero line: additional +5
  - Note "MA golden cross" in `ma_analysis` and `buy_reason`.
  - Set the ideal buy point near the level of the crossing moving averages.
