# Growth Quality Strategy

name: growth_quality
display_name: "Chất lượng tăng trưởng"
display_name_en: "Growth Quality"
description: Combines revenue and profit growth, ROE, cash flow, and industry runway to identify high-quality growth stocks and the risk of growth stalling.
category: framework
core_rules: [2, 3, 5]
required_tools:
  - get_stock_info
  - get_realtime_quote
  - search_stock_news
  - analyze_trend
aliases: ["chất lượng tăng trưởng", "cổ phiếu tăng trưởng", "tăng trưởng", "growth quality"]
default_priority: 55
market_regimes: [trending_up]

instructions: |
  **Growth Quality Strategy**

  Applicable scenarios:
  - Focus on the company's medium- to long-term growth capacity rather than only short-term technical patterns.
  - Suited to companies in high-growth (booming) industries, with continuously improving earnings, or in a business-model expansion phase.

  Analysis framework:

  1. **Growth**
     - First check the financial-statement fields for operating revenue, net profit attributable to shareholders of the parent, operating cash flow, and ROE.
     - Determine whether revenue growth and profit growth move in the same direction, and whether there is "revenue growth without profit growth".
     - If there is only thematic hype that financial statements have not yet verified, lower the growth certainty.

  2. **Quality**
     - The higher and more stable the ROE, the better the quality.
     - Operating cash flow moving in line with net profit indicates more reliable earnings quality.
     - When cash flow is significantly weaker than profit, flag risks in collections, inventory, or receivables.

  3. **Valuation tolerance**
     - Use valuation fields such as PE/PB and market cap to judge whether the market has already priced in (overdrawn) future growth.
     - High growth can support a higher valuation, but you must explain whether growth can justify the valuation.
     - When valuation is high and growth is slowing, lower the score markedly.

  4. **Trend confirmation**
     - Use `analyze_trend` to judge whether the long-term growth thesis has been confirmed by market capital flows.
     - When fundamentals are improving but technicals have not confirmed, prefer giving watch conditions over chasing a buy directly.

  Output requirements:
  - State clearly which stage the company is in: High-quality growth / Growth under verification / Growth slowing / Growth thesis invalidated.
  - Explain whether growth comes from revenue expansion, margin improvement, industry boom, or one-off factors.
  - Provide buy points suited to growth stocks: a breakout after earnings verification, a pullback to the long-term moving average, or a valuation pullback.

  Score adjustment guidelines:
  - Revenue, profit, cash flow, and ROE all improving together: `sentiment_score +15`
  - Industry boom and company news corroborate each other: additional `+6`
  - High valuation with unverified growth: `sentiment_score -8`
  - Revenue growth without profit growth, or deteriorating cash flow: `sentiment_score -12`
