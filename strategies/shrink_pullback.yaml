# Shrink Volume Pullback Strategy
# Volume shrinks during pullback to MA5/MA10, then price bounces.

name: shrink_pullback
display_name: 缩量回踩
display_name_en: "Low-Volume Pullback"
description: Detects low-volume pullbacks to moving-average support, an ideal entry point for trend continuation.
category: trend
core_rules: [1, 2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [缩量回踩, 回踩]
default_router: true
default_priority: 40
market_regimes: [trending_down, sideways]

instructions: |
  **Low-Volume Pullback (Shrink Volume Pullback Strategy)**

  Entry criteria:

  1. **Prerequisites** (related principle 2: trend trading):
     - The stock must be in an uptrend (MA5 > MA10 > MA20).
     - Use `analyze_trend` to confirm bullish MA alignment.

  2. **Pullback detection** (related principle 4: buy-point preference):
     - Use `get_daily_history` and `get_realtime_quote`.
     - Price pulls back to near MA5 (within 1%) or near MA10 (within 2%).
     - Volume during the pullback < 70% of the 5-day average volume (shrinking-volume signature).
     - `analyze_trend` → volume_status should indicate shrinking volume.

  3. **Rebound signal** (related principle 1: strict entry):
     - The current price holds the moving-average support.
     - MA5 bias < 2% — optimal buy zone.

  4. **Confirmation conditions** (related principle 5: risk screening):
     - `search_stock_news` shows no negative news.

  Score adjustments:
  - Low-volume pullback to MA5: sentiment_score +10
  - Low-volume pullback to MA10 with volume < 0.6x average volume: sentiment_score +8
  - Set the ideal buy point at the MA5 level, with MA10 as the secondary buy point.
  - Set the stop-loss at the MA20 level.
  - Note "low-volume pullback" in `buy_reason`.
