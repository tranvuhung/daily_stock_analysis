instructions: |
  **Chan Theory (Zen Channel Theory)**

  Core framework: fractal → stroke (bi) → segment (xianduan) → pivot zone (zhongshu) → trend

  ## Analysis Steps

  ### 1. Determine Price Structure (Pivot Zone Identification)
  - Use `get_daily_history` to fetch the last 60 days of daily data.
  - Identify the sequence of recent swing highs and lows, and determine whether price is currently in
    a **ranging pivot zone** (one or more pivot zones) or a **trending leg** (breaking away from the pivot zone upward/downward).
  - Pivot zone (zhongshu): the overlapping range of 3 consecutive price legs, within which price oscillates repeatedly.
  - Trend: 3 consecutive pivot zones of the same degree all shifting in the same direction.

  ### 2. Divergence (Beichi) Assessment (Highest-Priority Signal)
  - **Top divergence**: price makes a new high but the MACD red histogram area shrinks → Sell / Reduce signal.
  - **Bottom divergence**: price makes a new low but the MACD green histogram area shrinks → Buy / Add signal.
  - Use `analyze_trend` to obtain MACD data and compare it against price highs and lows.

  ### 3. Buy/Sell Point Determination
  - **Type-1 buy point** (strongest): bottom divergence appears at the last pivot zone of a downtrend.
  - **Type-2 buy point**: the first pullback after leaving a downtrend pivot zone does not break below the pivot zone high.
  - **Type-3 buy point**: an upward breakout after pivot-zone ranging (price does not return into the pivot zone).
  - **Type-1/2/3 sell points**: symmetric structures in the opposite direction.
  - The buy/sell point type at which the current price sits determines position size.

  ### 4. Degree and Position Sizing
  - Daily-degree buy/sell points allow a fairly heavy position (30-50%).
  - Weekly-degree buy/sell points allow a larger position (50-80%).
  - Multi-degree confluence (daily + weekly in the same direction) gives the strongest signal.

  ### 5. Output Requirements
  - State clearly whether price is currently in: an uptrend / a downtrend / pivot-zone ranging.
  - Indicate whether a divergence (beichi) signal exists and its degree.
  - Give the current buy/sell point type (Type-1/2/3 buy point, etc.); if none, write "No clear buy/sell point at present".
  - Place the stop-loss at the prior low (when buying) or the prior high (when selling).

  Score adjustment suggestions:
  - Bottom divergence + Type-1 buy point signal: `sentiment_score +15`
  - Type-2/Type-3 buy point confluence: `sentiment_score +10`
  - Pivot-zone ranging with no clear direction: `sentiment_score keep baseline`
  - Top divergence / downtrend: `sentiment_score -15`
