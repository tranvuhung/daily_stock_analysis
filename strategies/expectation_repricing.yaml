# Expectation Repricing Strategy

name: expectation_repricing
display_name: 预期重估
display_name_en: "Expectation Repricing"
description: Analyzes shifts in earnings, policy, and valuation expectations to find expectation-gap repair opportunities or pullback risk after expectations overheat.
category: framework
core_rules: [3, 5, 6]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_realtime_quote
  - analyze_trend
aliases: [预期, 预期差, 预期重估]
default_priority: 65
market_regimes: [volatile, sector_hot]

instructions: |
  **Expectation Repricing Strategy**

  Applicable scenarios:
  - Market expectations for the company's earnings, policy, industry boom, valuation anchor, or competitive landscape are changing.
  - You need to judge whether the current price reflects "expectation repair", "expectations dashed", or "overheated expectations".

  Analysis framework:

  1. **Sources of expectation change**
     - Use `search_stock_news` to identify recent information that changed market expectations: earnings pre-announcements, institutional views, orders, policy, product progress, industry data.
     - Distinguish hard information (announcements, financial reports, orders) from soft information (rumors, opinions, sentiment).

  2. **Direction of the expectation gap**
     - Positive expectation gap: the market was pessimistic, and new information shows the business or earnings are better than expected.
     - Negative expectation gap: the market was optimistic, and new information falls short of expectations or fails verification.
     - If the information has already been fully reflected by a run of strong gains, flag the risk of expectations being priced in ("sell the news").

  3. **Valuation repricing**
     - Use fields such as PE/PB, market cap, ROE, and cash flow to judge whether the valuation repricing is supported by fundamentals.
     - A valuation increase must be matched by earnings quality, growth sustainability, and industry runway.
     - When valuation falls, determine whether it is driven by a one-off disturbance or a change in the long-term thesis.

  4. **Price confirmation**
     - Use `analyze_trend` to judge whether the change in expectations has already translated into a trend.
     - A breakout on heavy / expanding volume can be read as expectations confirmed by capital; a rebound on low / shrinking volume leans more toward a repair to be watched.
     - Heavy volume with stalling price at highs, failure to rise on good news, or a break below key support may signal weakening expectations.

  Output requirements:
  - State clearly whether the current situation is: Positive expectation gap / Expectations priced in / Negative expectation gap / Expectations unclear.
  - Explain which information has changed market expectations and which still awaits verification.
  - Provide watch points: the next financial report, order delivery, policy implementation, valuation pullback, or technical confirmation.

  Score adjustment guidelines:
  - Positive expectation gap not yet fully priced in: `sentiment_score +15`
  - Positive expectation gap already realized by a run of strong gains: `sentiment_score -5`
  - Negative expectation gap, or core assumptions invalidated: `sentiment_score -15`
  - Insufficient information but potential for repair: stay neutral and lower confidence
