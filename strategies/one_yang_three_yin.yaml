# One Yang Three Yin Strategy
# K-line pattern: bullish → 3 small bearish → bullish. Consolidation end signal.

name: one_yang_three_yin
display_name: 一阳夹三阴
display_name_en: "One Yang Three Yin"
description: Detects the One Yang Three Yin candlestick consolidation pattern, a trend-continuation entry signal.
category: pattern
core_rules: [2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [一阳穿三阴, 一阳夹三阴]
default_priority: 110

instructions: |
  **One Yang Three Yin Strategy**

  Pattern definition (last 5 trading days):

  1. **Day 1**: a large bullish candle (close > open, body > 2% of the share price).
  2. **Days 2-4**: three consecutive bearish candles or small-bodied candles:
     - The low of each candle does not break below the Day 1 open.
     - Volume should shrink progressively (volume ratio < 0.8).
     - All three candles should close within the Day 1 body range.
  3. **Day 5**: another bullish candle, with the close breaking above the Day 1 close.

  How to evaluate with tools:

  1. Use `get_daily_history` to fetch the last 10 days of data.
  2. Check whether the last 5 candles match the pattern above.
  3. Use `analyze_trend` to confirm bullish MA alignment (related to Principle 2: trend trading, MA5 > MA10 > MA20).

  Score adjustment:
  - Pattern confirmed + bullish trend: sentiment_score +15
  - Pattern confirmed but trend unclear: sentiment_score +5
  - Note "One Yang Three Yin" in `pattern_analysis` and `buy_reason`.
  - Set the ideal buy point near the Day 5 close and the stop-loss below the Day 1 open.
