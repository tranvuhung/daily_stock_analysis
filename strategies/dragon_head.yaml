# Dragon Head Strategy
# Identifies sector leaders during sector rotation cycles.

name: dragon_head
display_name: 龙头策略
display_name_en: "Sector Leader (Dragon Head)"
description: Identifies sector leader stocks during sector rotation. Applicable when a sector starts to move or an industry catalyst emerges.
category: trend
core_rules: [2, 7]
required_tools:
  - get_realtime_quote
  - get_sector_rankings
  - search_stock_news
aliases: [龙头, 龙头战法]
default_priority: 90
market_regimes: [sector_hot]

instructions: |
  **Sector Leader Strategy (Dragon Head Strategy)**

  Evaluation criteria:

  1. **Sector leadership position**:
     - Use `get_sector_rankings` to check whether the stock's sector is among the recent top gainers.
     - Confirm whether the stock was the first to rally or hit limit-up during the sector's launch phase.

  2. **Turnover rate and momentum** (related to Principle 7: relaxed criteria for strong-trend stocks):
     - Use `get_realtime_quote` to check the turnover rate. A sector leader's turnover rate is usually > 5%.
     - A volume ratio > 1.5 indicates active trading interest.

  3. **Relative strength**:
     - Compare the stock's price change against the sector average.
     - A true sector leader should outperform its sector by more than 2% on up days.

  4. **News catalysts**:
     - Use `search_stock_news` to search for sector-level catalysts (policy, events, earnings).
     - Sector-leader rallies are often accompanied by a sector-wide catalyst.

  5. **Bias ratio check** (related to Principle 1: strict entry discipline):
     - For a sector leader, the bias ratio threshold may be relaxed to 7%, but caution is still required above 10%.

  Score adjustment:
  - Confirmed as a sector leader: sentiment_score +10
  - Sector is in an active rotation phase: additional +5
  - Note the "Sector Leader Strategy" assessment result in `buy_reason`.
