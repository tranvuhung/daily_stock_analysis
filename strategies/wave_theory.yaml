instructions: |
  **Elliott Wave Theory**

  Core principle: the market moves in a repeating cycle of a 5-wave impulse followed by a 3-wave correction.

  ## Analysis Steps

  ### 1. Identify the Current Wave
  Use `get_daily_history` to fetch the last 120 days of data, combined with trend data from `analyze_trend`:

  **Impulse waves (1-3-5) identification**:
  - Wave 1: the first leg of the trend reversal, with moderately expanding volume.
  - Wave 3: the strongest impulse wave, usually on heavy volume with strong MACD; never the shortest wave.
  - Wave 5: volume is often weaker than in Wave 3; if a top divergence appears, the wave is about to end after a final push higher.

  **Corrective waves (A-B-C) identification**:
  - Wave A: the first decline, on relatively heavy volume; most participants think it is just a pullback.
  - Wave B: a rebound weaker than the prior advance, on shrinking volume; high trap risk.
  - Wave C: the second decline, often stronger than Wave A, completing the correction.

  ### 2. Fibonacci Key Levels
  - Wave 2 typically retraces 38.2%~61.8% of Wave 1.
  - The Wave 3 target is typically a 1.618~2.618x extension of Wave 1.
  - Wave 4 must not enter the price territory of Wave 1 (doing so violates the wave rules).
  - Wave C target: measured from the top of Wave A, equal to or exceeding the length of Wave A.

  ### 3. Optimal Buy Points
  - **Wave 2 pullback stabilizing** ("golden pit"): the safest buy point; stop-loss at the start of Wave 1.
  - **Wave 4 pullback stabilizing**: second best; stop-loss at the top of Wave 1.
  - **Early Wave 3 breakout**: when price breaks above the Wave 1 high on heavy / expanding volume.
  - Avoid chasing highs at the end of Wave 5 (top divergence risk).

  ### 4. Risk Notes
  - Do not take a heavy position on a Wave B rebound (it is trap-like in nature).
  - Wave counting is subjective and must be validated with other technical indicators.
  - If a wave rule is violated (e.g. Wave 4 overlaps Wave 1), the count must be redone.

  ### 5. Output Requirements
  - Give the likely current wave position (e.g. "in the middle of Wave 3" or "likely a Wave 4 correction").
  - Give the key Fibonacci support/resistance levels (0.382/0.618/1.618).
  - State whether now is a time to Buy, Wait for an opportunity, or Avoid.
  - Mark the confidence level of the wave count (High / Medium / Low).

  Score adjustment suggestions:
  - Wave 2 bottom stabilizing (golden pit): `sentiment_score +15`
  - Wave 3 breakout confirmed: `sentiment_score +12`
  - End of Wave 5 / top divergence: `sentiment_score -10`
  - In a Wave C decline: `sentiment_score -12`
