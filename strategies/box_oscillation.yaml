instructions: |
  **Box Range Trading Strategy**

  Core logic: within a box, price oscillates repeatedly between resistance and support.
  "Buy close to support, sell near resistance" — capture range profits through swing trading.

  ## Analysis steps

  ### 1. Box identification
  Use `get_daily_history` to fetch the last 60~120 days of data:

  - **Box top (resistance)**: the line connecting recent highs that were touched multiple times without a valid breakout.
    Typically a cluster of 3 or more highs within 20~60 days.
  - **Box bottom (support)**: the line connecting recent lows that were tested multiple times without a valid breakdown.
  - Box validity: the top and bottom must each be touched at least 2~3 times to confirm the box.
  - Use the support_levels / resistance_levels from `analyze_trend` to help locate them.

  ### 2. Current position assessment
  Use `get_realtime_quote` to get the current price and compare it with the box boundaries:

  - **Box-bottom zone** (≤5% from support): Buy / Add signal; place stop-loss 3% below the box bottom.
  - **Mid-box zone** (middle 1/3 of the box): Watch; do not trade proactively.
  - **Box-top zone** (≤5% from resistance): Reduce / Take-profit signal; no need to chase.

  ### 3. Volume confirmation
  - **Stabilization at the box bottom on heavy / expanding volume**: strong signal that support holds; a heavier position is acceptable.
  - **Stalling at the box top on low / shrinking volume**: sell signal that resistance holds.
  - **Box breakout (volume more than 2x the average volume)**:
    - Valid upside breakout → switch to a bullish trend strategy; new target = box height projected upward.
    - Valid downside breakdown → exit and wait; former support turns into resistance.

  ### 4. Box width and expected return
  - Compute box width: (top - bottom) / bottom × 100%.
  - Width < 5%: too little room to trade; participation not recommended.
  - Width 5%~15%: standard box; swing trading is feasible.
  - Width > 15%: large box; larger swings can be traded.

  ### 5. False breakout identification
  - Intraday touch of resistance / support followed by a quick reversal, closing back inside the box → false breakout; keep trading the box.
  - Two consecutive closes beyond the box boundary with expanding volume → genuine breakout; change strategy.

  ### 6. Output requirements
  - State the box top price and box bottom price explicitly.
  - The zone the current price is in (box bottom / mid-box / box top).
  - If price has already broken out, state the breakout direction and the new target.
  - Recommended position size and stop-loss level.

  Score adjustment guidelines:
  - Stabilization at the box bottom + low / shrinking volume: `sentiment_score +10`
  - Rally from the box bottom toward the top on heavy volume: `sentiment_score +12`
  - Valid upside breakout of the box: `sentiment_score +15, switch to trend strategy`
  - In the box-top zone: `sentiment_score -5 (do not chase)`
  - Valid breakdown below the box bottom: `sentiment_score -15, exit`
