# Box Range Trading Strategy
# Buy at box support, sell at box resistance, profit from range-bound oscillation.

name: box_oscillation
display_name: 箱体震荡
display_name_en: "Box-Range Oscillation"
description: Identifies the price box (trading range), buying near the box bottom and reducing near the box top; suited to sideways, range-bound markets.
category: framework
core_rules: [1, 2, 3]
