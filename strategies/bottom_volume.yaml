# Bottom Volume Surge Strategy
# After extended decline, price stabilizes and volume spikes. Potential reversal.

name: bottom_volume
display_name: "Khối lượng tăng tại đáy"
display_name_en: "Bottom Volume Surge"
description: Detects a heavy-volume surge at the bottom after a prolonged decline, a potential trend-reversal signal.
category: reversal
core_rules: [2, 5]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: ["khối lượng tăng tại đáy", "tạo đáy", "bottom volume"]
default_priority: 60
market_regimes: [trending_down]

instructions: |
  **Bottom Volume Surge Strategy**

  Reversal criteria:

  1. **Confirm a sustained decline**:
     - Use `get_daily_history` (30 days).
     - Price has fallen > 15% from the 20-day high to the recent low.
     - `analyze_trend` → trend_status should be BEAR or STRONG_BEAR.

  2. **Abnormal volume**:
     - Today's volume > 3x the 5-day average volume.
     - Use `get_realtime_quote` → volume_ratio > 3.0.
     - This volume anomaly should come after a prior period of extremely low / shrinking volume.

  3. **Price stabilization**:
     - Today's candle closes bullish (close > open).
     - Price holds above the recent low.
     - Ideally a long lower shadow appears, showing buyer support.

  4. **Confirming factors** (linked to Principle 5: risk screening):
     - Use `search_stock_news` to confirm whether there is a fundamental catalyst.

  5. **Risk warnings** (linked to Principle 2: trend trading):
     - This is a reversal signal; its risk is higher than trend following.
     - Recommended position size is small (at most 20-30%).
     - Stop-loss must be strict (set below the recent low).

  Score adjustments:
  - Bottom volume surge confirmed: sentiment_score +8
  - Accompanied by a bullish candle + news catalyst: additional +5
  - Note "Bottom Volume Surge" in `buy_reason` and `pattern_analysis`.
  - Set the stop-loss at the recent low.
