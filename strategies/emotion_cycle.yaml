instructions: |
  **Sentiment Cycle Strategy**

  Core philosophy: market participants' sentiment cycles through "panic → pessimism → skepticism → hope → optimism → excitement → greed → euphoria".
  Smart money builds positions at panic bottoms and exits at euphoric tops.

  ## Quantitative Indicators of Sentiment Phase

  ### Step 1: Turnover Rate Analysis (Core Indicator of Sentiment Heat)
  Use `get_daily_history` and `get_realtime_quote`:

  - **Turnover rate < 0.5%/day**: the market is cold and ignored; a potential bottom zone (buy into others' panic).
  - **Turnover rate 0.5%~2%**: normal trading, stable sentiment.
  - **Turnover rate 2%~5%**: active; the market is starting to pay attention; do not chase highs.
  - **Turnover rate > 5%**: high heat, speculative retail money flooding in; beware of a sentiment top.
  - **Turnover rate > 10% (daily average)**: extremely overheated; usually a short-term top.

  ### Step 2: Turnover Rate Trend
  Use `get_daily_history` to calculate the turnover rate trend over the last 20 days:
  - Falling from high to low (steady cooling) + low / shrinking volume → sentiment ebbing; wait patiently.
  - Rising from low to high (accelerating heat) + sharply expanding volume → sentiment igniting; entry is possible.
  - Sudden single-day volume spike (turnover rate more than 5x the prior period) → often major players distributing; be on alert.

  ### Step 3: News Sentiment Analysis
  Use `search_stock_news` to search recent news and analyze the sentiment bias:
  - News clustering around "good news priced in, earnings beat, ceiling-price sessions, broker recommendations" → sentiment may be overheated.
  - News clustering around "earnings decline, negative news, break below support" → pessimism may be forming a bottom.
  - Extremely negative sentiment on retail forums / social media → contrarian indicator; may be near a bottom.

  ### Step 4: MA Convergence and Volatility
  Use `analyze_trend`:
  - MA5/MA10/MA20 lines converging (MA contraction) → building energy, direction undecided, sentiment cold.
  - Volatility falling to low levels (ATR contraction) → sentiment extremely depressed; a precursor to a breakout after consolidation.

  ## Sentiment Bottom Characteristics (Buy Zone)
  At least 3 of the following must be met:
  ✅ Turnover rate over the last 20 days is near its one-year low
  ✅ Volume keeps shrinking, more than 50% below the 60-day average volume
  ✅ Recent news is mainly muted, neutral, or negative
  ✅ Price is near or below MA20, but without a panic crash
  ✅ Institutional holdings are stable or slightly increasing (if data is available)

  ## Sentiment Top Characteristics (Reduce Zone)
  At least 3 of the following must be met:
  ⚠️ Turnover rate over the last 5 days > 2x the 20-day average
  ⚠️ Pulse-like volume expansion (single day)
  ⚠️ News is dominated by good news being priced in, sharp institutional target-price upgrades, and retail chasing
  ⚠️ Price deviates more than 8% from MA5 (high bias ratio)
  ⚠️ MACD shows a top divergence

  ## Output Requirements
  - Current sentiment phase: Cold Bottom / Stable / Warming (Entry) / Overheated (Caution) / Euphoric Top.
  - Compare the current turnover rate with the one-year average turnover rate.
  - Whether the sentiment bottom or top characteristics are met (list the items that are met).
  - Give a contrarian trading suggestion (be greedy when the crowd is fearful, be cautious when the crowd is greedy).

  Score adjustment suggestions:
  - 3 or more sentiment bottom characteristics met: `sentiment_score +14`
  - All 5 sentiment bottom characteristics met: `sentiment_score +20`
  - 3 or more sentiment top characteristics met: `sentiment_score -12`
  - All 5 sentiment top characteristics met: `sentiment_score -20`
  - Stable sentiment range: no adjustment to the base score
