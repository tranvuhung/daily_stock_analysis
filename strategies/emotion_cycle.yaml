# Sentiment Cycle Strategy
# Uses market sentiment, turnover rate and volume pattern to time entries against crowd behavior.

name: emotion_cycle
display_name: 情绪周期
display_name_en: "Sentiment Cycle"
description: Uses market sentiment, turnover rate, and price-volume structure to identify sentiment lows (panic bottoms) and sentiment highs (euphoric tops), positioning against crowd sentiment.
category: framework
core_rules: [1, 2, 3, 5]
