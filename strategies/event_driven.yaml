# Event Driven Strategy

name: event_driven
display_name: 事件驱动
display_name_en: "Event Driven"
description: Evaluates catalyst strength, probability of realization, and risk boundaries around events such as earnings, policy, M&A, orders, and product launches.
category: framework
core_rules: [3, 5]
required_tools:
  - search_stock_news
  - get_realtime_quote
  - analyze_trend
aliases: [事件驱动, 催化, 催化事件]
default_priority: 45
market_regimes: [sector_hot, volatile]

instructions: |
  **Event Driven Strategy**

  Applicable scenarios:
  - The company or its industry has a clear event catalyst, such as an earnings pre-announcement, order win, M&A / restructuring, policy implementation, product launch, regulatory penalty, or litigation.
  - You need to determine whether the event is a short-term trading catalyst, a long-term fundamental improvement, or a "sell the news" realization of good news.

  Analysis framework:

  1. **Event classification**
     - Use `search_stock_news` to map out recent key events.
     - Classify events as: earnings, policy, orders / products, capital operations (corporate actions), or regulatory / risk.
     - Pin down when each event occurred; stale information or information with an unknown date must not serve as the primary basis.

  2. **Impact pathway**
     - Determine whether the event affects revenue, profit margin, valuation, financing capacity, market share, or only sentiment.
     - For major orders or favorable policies, state the realization timeline and the uncertainty involved.
     - For events such as regulatory action, insider / major-holder share reductions, penalties, or litigation, risk takes priority.

  3. **Market reaction**
     - Use `get_realtime_quote` and `analyze_trend` to judge whether the event is already fully priced in.
     - A rally on heavy / expanding volume that has not cleared key resistance: wait for confirmation.
     - Heavy volume with stalling price at highs, or a spike-and-fade after good news, signals profit-taking pressure — stay alert.

  4. **Trading plan**
     - Before the event is realized, emphasize position sizing and the time window.
     - After the event is realized, reassess whether to switch from "trading the expectation" to "earnings verification".
     - For negative events, first check whether the risk has been fully released before considering a rebound.

  Output requirements:
  - State the nature of the event clearly: Bullish / Bearish / Neutral / Uncertain.
  - Provide the event's credibility, realization timeline, and degree to which it is already priced in.
  - Trading advice must include invalidation conditions, such as an announcement falling short of expectations, a break below key support, or the event's hype fading.

  Score adjustment guidelines:
  - Highly credible positive event not yet fully priced in: `sentiment_score +14`
  - Positive event already largely priced in: `sentiment_score -6`
  - Negative event still unfolding: `sentiment_score -15`
  - Unclear event impact or conflicting information: stay neutral and lower confidence
