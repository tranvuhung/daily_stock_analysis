# Automatically close stale Issues and PRs
# Runs daily and marks issues/PRs that have been inactive for a long time

name: Stale Issues & PRs

on:
  schedule:
    # Runs daily at UTC 0:00 (08:00 Beijing time)
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 清理过期 Issues/PRs
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏷️ 标记并关闭过期内容
        uses: actions/stale@v10
        with:
          # ===== Issue settings =====
          days-before-issue-stale: 7
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            👋 这个 Issue 已经 **7 天** 没有活动了。
            
            如果问题仍然存在，请回复说明最新情况，我们会继续跟进。
            如果问题已解决或不再需要，可以直接关闭此 Issue。
            
            **如果 7 天内没有回复，此 Issue 将自动关闭。**
          close-issue-message: |
            🔒 由于长时间没有活动，此 Issue 已自动关闭。
            
            如果问题仍然存在，欢迎重新打开或创建新的 Issue。
          
          # ===== PR settings =====
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: |
            👋 这个 PR 已经 **21 天** 没有活动了。
            
            请检查是否需要：
            - 解决合并冲突
            - 回复 review 意见
            - 更新代码
            
            **如果 14 天内没有更新，此 PR 将自动关闭。**
          close-pr-message: |
            🔒 由于长时间没有活动，此 PR 已自动关闭。
            
            如果您仍希望合入这些更改，请重新打开或创建新的 PR。
          
          # ===== Exemption rules =====
          # Items with these labels are never marked stale
          exempt-issue-labels: 'pinned,security,enhancement,help wanted,good first issue'
          exempt-pr-labels: 'pinned,security,work-in-progress,wip'
          
          # Exempt draft PRs
          exempt-draft-pr: true
          
          # ===== Other settings =====
          # Maximum number of operations per run
          operations-per-run: 50
          
          # Only process items with these labels
          only-labels: ''
          
          # Remove the stale label when there is new activity
          remove-stale-when-updated: true
          
          # Debug mode (when true, only log without taking action)
          debug-only: false
