# ===================================
# Vietnam stock watchlist analysis system - Docker Compose
# ===================================
# 
# Usage:
#   Scheduled mode: docker-compose -f ./docker/docker-compose.yml up -d
#   FastAPI mode: docker-compose -f ./docker/docker-compose.yml up -d server
#   Start both: docker-compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis
version: '3.8'

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # Environment variables (loaded from the .env file). Do not mount ../.env as a single-file volume at /app/.env,
  # otherwise the Docker mount point blocks the atomic os.replace update when settings are saved.
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # To override frontend static assets, mount a local static directory
    # - ../static:/app/static:ro

  environment:
    - TZ=Asia/Ho_Chi_Minh

    # Web/API service bind address (must be 0.0.0.0 inside container)
    - WEBUI_HOST=0.0.0.0
    # API_PORT is read from the .env file; no need to hardcode it here

    # Proxy settings (if needed)
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # Resource limits: 1G+ recommended for full analysis; 512M only suits light Web/API, single-stock, low-concurrency use,
  # and then set MAX_WORKERS=1 and avoid running analyzer and server together.
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # Scheduled task mode
  analyzer:
    <<: *common
    container_name: stock-analyzer

  # FastAPI mode
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    # With network_mode: host the ports mapping below has no effect; the port comes from --port in command
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
